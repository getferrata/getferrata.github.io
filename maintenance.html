<link rel="apple-touch-icon" href="apple-touch-icon.png" />
<style>
  :root {
    --font-serif: ui-serif, Georgia, Cambria, "Times New Roman", serif;
    --font-sans: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    --font-mono: ui-monospace, "SFMono-Regular", "JetBrains Mono", Menlo, Consolas, monospace;
    --bg:#f5f1e8; --surface:#fbf8f1; --border:#d8d0bf; --text:#221f1a; --text-muted:#5f584b; --accent:#a83232; --accent-contrast:#ffffff; --radius:8px;
  }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
    --bg:#17150f; --surface:#201d16; --border:#37322a; --text:#ece6d8; --text-muted:#a79c87; --accent:#e0705f; --accent-contrast:#1a1712;
  }}
  :root[data-theme="dark"] { --bg:#17150f; --surface:#201d16; --border:#37322a; --text:#ece6d8; --text-muted:#a79c87; --accent:#e0705f; --accent-contrast:#1a1712; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:flex; flex-direction:column; background:var(--bg); color:var(--text);
    font-family:var(--font-sans); font-size:1.0625rem; line-height:1.6; -webkit-font-smoothing:antialiased; }
  .wrap { width:min(40rem, 100% - 2.5rem); margin-inline:auto; }
  main { flex:1; display:flex; align-items:center; padding-block:4rem; }
  .mark { width:3.4rem; height:3.4rem; color:var(--text); }
  .eyebrow { font-family:var(--font-mono); font-size:.72rem; letter-spacing:.18em; text-transform:uppercase; color:var(--accent);
    display:inline-flex; align-items:center; gap:.5rem; margin-top:1.6rem; }
  .eyebrow::before { content:""; width:1.5rem; height:2px; background:var(--accent); }
  h1 { font-family:var(--font-serif); font-weight:600; letter-spacing:-.015em; line-height:1.08; font-size:clamp(2rem,5vw,3rem); margin:.7rem 0 0; text-wrap:balance; }
  p.lede { color:var(--text-muted); max-width:32rem; margin:1.1rem 0 0; }
  .actions { display:flex; flex-wrap:wrap; gap:.85rem; margin-top:2rem; }
  .btn { display:inline-flex; align-items:center; min-height:2.8rem; padding-inline:1.3rem; border-radius:var(--radius); font-weight:600; text-decoration:none; border:1px solid transparent; }
  .btn-primary { background:var(--accent); color:var(--accent-contrast); }
  .btn-ghost { background:transparent; color:var(--text); border:1px solid var(--border); }
  footer { border-top:1px solid var(--border); }
  footer .wrap { display:flex; justify-content:space-between; gap:1rem; padding-block:1.4rem; font-family:var(--font-mono); font-size:.7rem; letter-spacing:.06em; color:var(--text-muted); flex-wrap:wrap; }
  footer a { color:inherit; }
</style>
<script>(function(){try{var t=localStorage.getItem('ferrata-theme');if(t==='light'||t==='dark'){document.documentElement.setAttribute('data-theme',t);}}catch(e){}})();</script>
</head>
